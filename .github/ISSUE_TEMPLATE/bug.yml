name: Bug report
description: Something in CVC does not work as documented
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe the actual behavior.
      placeholder: I ran ... and got ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: A prompt, a JSON input, or a command.
      render: shell
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model / version
      placeholder: Claude 4.5 / GPT-5 / Qwen3 / ...
  - type: input
    id: python
    attributes:
      label: Python version (if relevant)
      placeholder: "3.11"
