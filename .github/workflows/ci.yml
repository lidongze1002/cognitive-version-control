name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run bad-case demo
        run: python eval/convergence_metrics.py --demo

      - name: Run good-case demo
        run: python eval/convergence_metrics.py --demo-good

      - name: Run sample data
        run: python eval/convergence_metrics.py --input eval/sample_data.json --json

      - name: Annotation smoke test
        run: |
          python eval/annotate.py --template eval/annotation_template.jsonl --out /tmp/annotation.json
          python eval/annotate.py --check /tmp/annotation.json
          python eval/annotate.py --summary eval/sample_data.json

      - name: Validate JSON metadata
        run: |
          python - <<'PY'
          import json
          for path in (".zenodo.json", "eval/sample_data.json"):
              with open(path, encoding="utf-8") as fh:
                  json.load(fh)
              print(f"{path}: ok")
          PY
